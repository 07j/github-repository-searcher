spring.application.name=github-repository-searcher

# Render (and most hosts) pass the port in the PORT variable; 8080 locally
server.port=${PORT:8080}
# Respect https from the hosting proxy so Swagger "Try it out" works on the live URL
server.forward-headers-strategy=framework

# PostgreSQL connection. Locally the password comes from local.properties;
# on the server all three values come from environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/github_searcher}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates the "repositories" table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Optional: a GitHub personal access token raises the rate limit from 60 to 5000 requests/hour.
github.api.token=${GITHUB_TOKEN:}

# Local secrets (not pushed to GitHub)
spring.config.import=optional:file:./local.properties
