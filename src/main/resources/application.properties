spring.application.name=github-repository-searcher

server.port=8080

# PostgreSQL connection. Username and password come from environment variables, so no password is stored in the code.
spring.datasource.url=jdbc:postgresql://localhost:5432/github_searcher
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates the "repositories" table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Optional: a GitHub personal access token raises the rate limit from 60 to 5000 requests/hour.
# Leave it empty to call the API without a token.
github.api.base-url=https://api.github.com
github.api.token=${GITHUB_TOKEN:}
spring.config.import=optional:file:./local.properties